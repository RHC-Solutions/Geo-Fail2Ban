[abuseipdb]
enabled = true
filter = abuseipdb
logpath = /var/log/abuseipdb.log
maxretry = 1
bantime = -1
findtime = 1w
# action_ = ban only. NOT action_mw: that appends a sendmail-whois action, so
# every permanent ban would try to mail root via an MTA this box need not have,
# logging an action error each time. Notifications go out over Telegram below.
action = %(action_)s
         telegram
